<div class="www-screen www-screen--center" *ngIf="isVisible()">
  <div class="www-stack-lg">
    <p class="www-kicker">Etwas ist schiefgelaufen</p>
    <p class="www-lede">{{ getErrorMessage() }}</p>
  </div>

  <div class="www-dock">
    <button type="button" class="www-btn www-btn--primary www-btn--block" (click)="tryAgain()">Nochmals versuchen</button>
    <button type="button" class="www-btn www-btn--ghost www-btn--block" (click)="leaveGame()">Zurück zur Startseite</button>
  </div>
</div>
