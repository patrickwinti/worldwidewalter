<div class="www-field-group">
  <label class="www-label">Dein Vorschlag — was gehört in die Lücke?</label>
  <input *ngFor="let walter of proposition; let i = index" class="www-field" type="text"
         placeholder="{{ i + 1 }}. Walterersatz (max. {{ MAX_INPUT_LENGTH }} Zeichen)"
         maxlength="{{ MAX_INPUT_LENGTH }}" [(ngModel)]="walter.text">
</div>

<div class="www-dock">
  <www-count-down [timeoutString]="round.endOfSubmissionsInUtc"
                  (timeoutEmitter)="emitProposition()">
  </www-count-down>
  <button type="button" class="www-btn www-btn--primary www-btn--block"
          [disabled]="!canEmitProposition" (click)="emitProposition()">Senden</button>
</div>
