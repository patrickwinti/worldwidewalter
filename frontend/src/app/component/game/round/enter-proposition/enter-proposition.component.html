<div class="column">
  <div>
    <div><h3>{{round.prompt}}</h3></div>
    <br>
    <br>
    <div class="textbox special-margin2 special-margin3">Dein Vorschlag</div>
    <br>

    <div *ngFor="let walter of proposition; let i = index">
      <input class="special-margin2" type="text" placeholder="{{i+1}}. Walterersatz"
             [(ngModel)]="walter.text">
    </div>

  </div>
  <br>
  <button class="special-margin2" (click)="emitProposition()">Senden</button>
</div>

<www-count-down [timeoutString]="round.endOfSubmissionsInUtc"
                (timeoutEmitter)="emitProposition()">
</www-count-down>
