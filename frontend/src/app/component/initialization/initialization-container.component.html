<ng-container [ngSwitch]="state">
  <www-welcome *ngSwitchCase="AppState.WELCOME_PAGE"
               (newGameEmitter)="setGame($event)"
               (appStateEmitter)="setState($event)">
  </www-welcome>

  <www-join *ngSwitchCase="AppState.JOIN_GAME"
            [presetGameId]="presetGameId" >
  </www-join>
</ng-container>
