<ng-container *ngIf="result$ | async as result">
  <www-prompt-display [prompt]="prompt"
                      [proposition]="getSphinxProposition(result)">
  </www-prompt-display>

  <h2>Übersicht Vorschläge</h2>
  <www-selection-disclosure [selections]="result.selections">
  </www-selection-disclosure>
  <br>
  <br>
  <h2>Ranking</h2>
  <www-ranking-display [sortedResults]="sortRanking(result.ranking)">
  </www-ranking-display>
</ng-container>

<div>
  <button class="center" (click)="continue()">
    Weiter
  </button>
</div>
