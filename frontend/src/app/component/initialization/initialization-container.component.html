<ng-container [ngSwitch]="state">
  <www-welcome *ngSwitchCase="InitializationState.WELCOME_PAGE"
               (initializationStateEmitter)="setState($event)">
  </www-welcome>

  <www-join *ngSwitchCase="InitializationState.JOIN_GAME"
            (initializationStateEmitter)="setState($event)">
  </www-join>

  <www-lobby *ngSwitchCase="InitializationState.LOBBY"
             (initializationStateEmitter)="setState($event)">
  </www-lobby>
</ng-container>
