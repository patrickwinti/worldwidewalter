<ul class="www-disclosure__list">
  <li class="www-disclosure__item" *ngFor="let selection of selections"
      [class.www-disclosure__item--sphinx]="selection.sphinxResponse">
    <p class="www-disclosure__gap">
      {{ concatStrings(selection.gaps) }}
      <span *ngIf="selection.sphinxResponse" class="www-disclosure__tag">Sphinx</span>
    </p>
    <p class="www-disclosure__meta"><span>Von</span> {{ concatStrings(selection.authors) || '—' }}</p>
    <p class="www-disclosure__meta"><span>Getippt von</span> {{ concatStrings(selection.selectors) || 'niemandem' }}</p>
  </li>
</ul>
