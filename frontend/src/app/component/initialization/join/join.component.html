Spiel Id: <input type="text" name="gameId" placeholder="Spiel Id"
                [readOnly]="gameIdIsReadOnly"
                [(ngModel)]="joinGameId"/>
Name: <input type="text" name="playerName" placeholder="Name eingeben" [(ngModel)]="playerName"/>
<button (click)="joinGame()" formtarget="_blank">beitreten</button>

<ng-container *ngIf="error">
  <div>
    {{this.errorText}}
  </div>
</ng-container>
