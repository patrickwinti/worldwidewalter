<div class="content">

  <input type="text" name="playerName" placeholder="Name eingeben" autofocus [(ngModel)]="playerName"/>

  <input type="text" name="gameId" placeholder="Spiel Id eingeben"
         [readOnly]="gameIdIsReadOnly"
         [(ngModel)]="joinGameId"/>


  <button (click)="joinGame()" formtarget="_blank">Beitreten</button>
</div>
<ng-container *ngIf="error">
  <p style="color: orangered">
    {{this.errorText}}
  </p>
</ng-container>
