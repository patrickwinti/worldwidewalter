<div class="www-screen">
  <div class="www-stack-lg">
    <p class="www-title">Der wahre <em>Walter</em></p>
    <p class="www-lede">Ein Satz, ein fehlendes Wort. Alle bluffen — du errätst, welcher Vorschlag von der Sphinx
      stammt.</p>
  </div>

  <div class="www-field-group">
    <label class="www-label" for="welcome-name">Dein Name</label>
    <input id="welcome-name" class="www-field" type="text" name="playerName" autofocus
           placeholder="Name eingeben" maxlength="{{MAX_INPUT_LENGTH}}" [(ngModel)]="playerName"/>
    <p *ngIf="error" class="www-error-text">Fehler beim Erstellen des Spiels.</p>
  </div>

  <div class="www-dock">
    <button type="button" class="www-btn www-btn--primary www-btn--block"
            [disabled]="!canCreateGame" (click)="requestNewGame()">Neues Spiel</button>
    <button type="button" class="www-btn www-btn--ghost www-btn--block" (click)="goToJoinPage()">Spiel beitreten</button>
  </div>
</div>
