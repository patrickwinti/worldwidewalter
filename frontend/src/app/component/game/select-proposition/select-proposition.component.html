<div class="column">
  <div>Bitte einen Vorschlag aussuchen:</div>

  <div *ngFor="let proposition of propositions; let i = index">
    <p>
      <button (click)="selectProposition(i)">
        {{proposition.gaps}}
      </button>
    </p>
  </div>
</div>

<www-count-down (timeoutEmitter)="selectProposition(undefined)">
</www-count-down>
