<div class="column">
  <div>Bitte einen Vorschlag aussuchen:</div>

  <div *ngFor="let proposition of propositionSelectionDto.propositions | keyvalue">
    <p>
      <button (click)="selectProposition(proposition.key)">
        {{proposition.value}}
      </button>
    </p>
  </div>
</div>

<www-count-down (timeoutEmitter)="selectProposition(undefined)">
</www-count-down>
