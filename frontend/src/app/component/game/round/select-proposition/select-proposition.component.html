<h3 class="www-select__heading">
  {{ isSphinx() ? 'Das haben die anderen geraten' : 'Welcher Vorschlag ist von der Sphinx?' }}
</h3>

<div class="www-choices">
  <button *ngFor="let proposition of propositionSelectionDto.propositions" type="button"
          class="www-choice"
          [class.www-choice--selected]="selectedId === proposition.id"
          [disabled]="proposition.readOnly || isSphinx()"
          (click)="pick(proposition)">
    <span class="www-choice__tick"></span>
    <span class="www-choice__text">
      {{ proposition.gaps.join(', ') }}
      <span *ngIf="proposition.numberOfAuthors > 1" class="www-choice__by">· {{ proposition.numberOfAuthors }} Autor:innen</span>
    </span>
  </button>
</div>

<div class="www-dock">
  <www-count-down [timeoutString]="propositionSelectionDto.selectionSubmissionEndInUtc"
                  (timeoutEmitter)="continue()">
  </www-count-down>

  <p *ngIf="isSphinx()" class="www-center www-muted">Warte auf die anderen Spieler…</p>

  <button *ngIf="showContinueButton()" type="button"
          class="www-btn www-btn--primary www-btn--block" (click)="selectProposition(undefined)">Weiter</button>

  <button *ngIf="!isSphinx() && !showContinueButton()" type="button"
          class="www-btn www-btn--primary www-btn--block"
          [disabled]="selectedId === undefined" (click)="confirmSelection()">Auswahl bestätigen</button>
</div>
