<p class="www-prompt">
  <ng-container *ngFor="let promptFragment of splitPrompt; index as i; last as isLast">
    <span>{{ promptFragment }}</span><!--
 --><span *ngIf="!isLast" class="www-gap" [class.www-gap--filled]="proposition && proposition[i]">{{ (proposition && proposition[i]) || 'Walter' }}</span>
  </ng-container>
</p>
