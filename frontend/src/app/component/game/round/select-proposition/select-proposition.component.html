<div class="column">
  <div>Bitte einen Vorschlag aussuchen:</div>

  <div *ngFor="let proposition of propositionSelectionDto.propositions">
    <p>
      <button [disabled]="proposition.readOnly" (click)="selectProposition(proposition.id)">
        {{createDisplayTextForProposition(proposition)}}
      </button>
    </p>
  </div>
</div>

<www-count-down [timeoutString]="propositionSelectionDto.selectionSubmissionEndInUtc"
                (timeoutEmitter)="continue()">
</www-count-down>
